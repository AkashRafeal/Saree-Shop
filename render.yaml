services:
  # Spring Boot Web API Service on Render
  - type: web
    name: sareeaura-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: sareeaura-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

# Free Managed PostgreSQL Database on Render
databases:
  - name: sareeaura-db
    databaseName: sareeaura_db
    user: sareeaura_user
    plan: free
    region: oregon
